<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101020">
  <title>Nova AI</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0b0b16;color:#f7f7ff;font-family:Arial,sans-serif;height:100dvh;display:flex;flex-direction:column}
    header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#151529;border-bottom:1px solid #30304b}
    .logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:linear-gradient(135deg,#9333ea,#06b6d4)}
    h2{margin:0 0 4px;font-size:20px}header small{color:#aaa}
    #chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
    .welcome{text-align:center;margin:auto 0;color:#ddd;padding:18px}
    .welcome h1{font-size:clamp(28px,6vw,38px);background:linear-gradient(90deg,#c084fc,#22d3ee);color:transparent;background-clip:text}
    .welcome p{color:#aaa}
    .msg{max-width:88%;padding:13px 15px;border-radius:17px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
    .user{align-self:flex-end;background:#6546cc}.bot{align-self:flex-start;background:#1d1d32;border:1px solid #30304b}
    .generated{display:block;max-width:min(100%,420px);width:100%;height:auto;border-radius:14px;margin-top:10px}
    .controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 12px;background:#111120}
    button{cursor:pointer;color:white}
    .tool{padding:10px 13px;border:1px solid #393953;border-radius:13px;background:#202035}
    #form{display:flex;gap:8px;padding:12px;background:#111120}
    input{flex:1;min-width:0;padding:14px;border:1px solid #393953;border-radius:14px;background:#202035;color:white;font-size:16px}
    .send{border:0;border-radius:14px;padding:0 18px;background:linear-gradient(135deg,#9333ea,#4f46e5);font-size:20px}
    #status{text-align:center;color:#aaaad0;font-size:12px;padding:4px 10px;background:#111120}
    footer{text-align:center;color:#777;font-size:11px;padding:7px;background:#111120}
    .hint{font-size:12px;color:#aaa;text-align:center;padding:0 12px 8px;background:#111120}
    button:disabled{opacity:.5;cursor:wait}
  </style>
</head>
<body>
  <header>
    <div class="logo">✦</div>
    <div><h2>Nova AI</h2><small>Tu asistente inteligente</small></div>
  </header>

  <main id="chat">
    <div class="welcome" id="welcome">
      <h1>¡Hola! Soy Nova ✨</h1>
      <p>Escríbeme, háblame o crea una imagen.</p>
    </div>
  </main>

  <div id="status">Comprobando conexión...</div>
  <div class="controls">
    <button class="tool" id="mic" type="button">🎙️ Hablar</button>
    <button class="tool" id="voice" type="button">🔊 Voz activada</button>
    <button class="tool" id="stop" type="button">⏹ Detener voz</button>
    <button class="tool" id="imageMode" type="button">🎨 Crear imagen</button>
  </div>
  <form id="form">
    <input id="input" placeholder="Escribe un mensaje..." autocomplete="off" maxlength="4000">
    <button class="send" type="submit" aria-label="Enviar">➤</button>
  </form>
  <div class="hint">Para crear una imagen, toca 🎨 y escribe lo que quieres ver.</div>
  <footer>Nova AI · Protege tu clave de API: nunca la pongas en este HTML.</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const statusEl = document.getElementById("status");
const form = document.getElementById("form");
const mic = document.getElementById("mic");
const voiceBtn = document.getElementById("voice");
const imageModeBtn = document.getElementById("imageMode");
let voiceOn = true;
let imageMode = false;
let recognition = null;

function addMessage(text, type) {
  document.getElementById("welcome")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
function speak(text) {
  if (!voiceOn || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "es-MX";
  utterance.rate = 1;
  const voices = speechSynthesis.getVoices();
  utterance.voice = voices.find(v => v.lang === "es-MX") || voices.find(v => v.lang.startsWith("es")) || null;
  speechSynthesis.speak(utterance);
}
async function sendChat(text) {
  const bubble = addMessage("Nova está pensando…", "bot");
  statusEl.textContent = "Consultando la IA…";
  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({message:text})
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Error de conexión");
    bubble.textContent = data.reply;
    speak(data.reply);
    statusEl.textContent = "Nova está lista.";
  } catch (err) {
    bubble.textContent = "No pude conectarme: " + err.message;
    statusEl.textContent = "Revisa el servidor y la conexión.";
  }
  chat.scrollTop = chat.scrollHeight;
}
async function generateImage(prompt) {
  const bubble = addMessage("Creando tu imagen… 🎨", "bot");
  statusEl.textContent = "Generando imagen… puede tardar un poco.";
  try {
    const response = await fetch("/api/images", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({prompt})
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "No se pudo generar la imagen");
    bubble.textContent = "Aquí tienes tu imagen ✨";
    const img = document.createElement("img");
    img.className = "generated";
    img.alt = prompt;
    img.src = data.image;
    bubble.appendChild(img);
    statusEl.textContent = "Imagen creada.";
  } catch (err) {
    bubble.textContent = "No pude crear la imagen: " + err.message;
    statusEl.textContent = "Error al generar imagen.";
  }
  chat.scrollTop = chat.scrollHeight;
}
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addMessage(text, "user");
  if (imageMode) {
    imageMode = false;
    imageModeBtn.textContent = "🎨 Crear imagen";
    await generateImage(text);
  } else {
    await sendChat(text);
  }
});
imageModeBtn.addEventListener("click", () => {
  imageMode = !imageMode;
  imageModeBtn.textContent = imageMode ? "🎨 Modo imagen activado" : "🎨 Crear imagen";
  input.placeholder = imageMode ? "Describe la imagen que quieres crear…" : "Escribe un mensaje…";
  statusEl.textContent = imageMode ? "Modo imagen: describe lo que quieres ver y pulsa enviar." : "Modo chat activado.";
  input.focus();
});
voiceBtn.addEventListener("click", () => {
  voiceOn = !voiceOn;
  voiceBtn.textContent = voiceOn ? "🔊 Voz activada" : "🔇 Voz desactivada";
  if (!voiceOn && "speechSynthesis" in window) speechSynthesis.cancel();
});
document.getElementById("stop").addEventListener("click", () => {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  statusEl.textContent = "Voz detenida.";
});
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "es-MX";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition.onstart = () => { mic.textContent = "🎙️ Escuchando…"; statusEl.textContent = "Habla ahora."; };
  recognition.onend = () => { mic.textContent = "🎙️ Hablar"; };
  recognition.onerror = (event) => { statusEl.textContent = "No se pudo usar el micrófono: " + event.error; };
  recognition.onresult = (event) => {
    input.value = event.results[0][0].transcript;
    statusEl.textContent = "Te escuché. Enviando…";
    form.requestSubmit();
  };
  mic.addEventListener("click", () => {
    try { recognition.start(); } catch (_) { statusEl.textContent = "El micrófono ya está activo."; }
  });
} else {
  mic.addEventListener("click", () => {
    statusEl.textContent = "Este navegador no admite reconocimiento de voz. Prueba Chrome y permite el micrófono.";
  });
}
fetch("/api/health").then(r => r.json()).then(data => {
  statusEl.textContent = data.apiConfigured ? "Conectada. Nova está lista." : "Servidor activo, pero falta configurar la clave de API.";
}).catch(() => {
  statusEl.textContent = "No se detectó el servidor. Abre la web publicada por el servidor, no el HTML local.";
});
</script>
</body>
</html>
